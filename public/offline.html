<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SchoolLedger is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f7f4; color: #0c1810; font-family: sans-serif; padding: 24px; }
      main { max-width: 28rem; }
      h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 16px; background: #0a5c2e; color: white; text-decoration: none; border-radius: 12px; padding: 0 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>SchoolLedger could not reach the network. Open the app again when you are back online. Demo data already on this device is still available after the app shell loads.</p>
      <a href="/login">Try again</a>
    </main>
  </body>
</html>
